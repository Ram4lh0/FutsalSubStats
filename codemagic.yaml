#  ┌────────────────────────────────────────────────────────────────────┐
#  │  Como isto se usa                                                  │
#  └────────────────────────────────────────────────────────────────────┘
#
#  web-pwa-ci             corre a cada push: testes, verificadores e build.
#  ios-capacitor-preview  compila para simulador, sem assinatura. Serve para
#                         confirmar que o projeto iOS não partiu.
#  ios-testflight         o que interessa: compila assinado e envia para o
#                         TestFlight. É corrido à mão, não a cada push.
#  android-preview        o mesmo do preview do iOS, mas para Android: um APK de
#                         depuração a cada push, sem segredos nenhuns.
#  android-google-play    compila um AAB assinado e envia para a faixa interna
#                         da Play Console. Também à mão.
#
#  O ios-testflight precisa de:
#
#  1. Integração App Store Connect em Teams → Integrations → Developer Portal.
#     A integração usada por este projeto chama-se `FutsalSubStats`.
#  2. Grupo de variáveis `appstore` com CERTIFICATE_PRIVATE_KEY, contendo a
#     chave privada PEM do certificado Apple Distribution.
#
#  O provisioning profile App Store é criado/obtido automaticamente durante a
#  build através da API da Apple.

workflows:
  web-pwa-ci:
    name: FutsalSubStats Web/PWA CI
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      node: lts
      vars:
        NEXT_TELEMETRY_DISABLED: "1"

    cache:
      cache_paths:
        - node_modules

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Run checks and tests
        script: npm run check

      - name: Build Next.js app
        script: npm run build

  ios-capacitor-preview:
    name: FutsalSubStats iOS Capacitor Preview
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: lts
      xcode: latest
      vars:
        NEXT_TELEMETRY_DISABLED: "1"

    cache:
      cache_paths:
        - node_modules
        - ~/Library/Developer/Xcode/DerivedData

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Run checks and tests
        script: npm run check

      - name: Build web bundle and sync iOS
        script: |
          npx next build
          npx cap sync ios

      - name: Build iOS simulator app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/Build/Products/Debug-iphonesimulator/App.app \
            build/ios/Build/Products/Debug-iphonesimulator/FutsalSubStats.app.zip

    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/FutsalSubStats.app.zip

  # ------------------------------------------------------------ TestFlight
  ios-testflight:
    name: FutsalSubStats iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: FutsalSubStats

    environment:
      node: lts
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.futsalsubstats.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        NEXT_TELEMETRY_DISABLED: "1"

    cache:
      cache_paths:
        - node_modules

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Run checks and tests
        script: npm run check

      - name: Build web bundle and sync iOS
        script: |
          npx next build
          npx cap sync ios

      - name: Set up signing
        script: |
          set -euo pipefail

          SIGNING_DIR="$HOME/codemagic-signing"
          CERTIFICATES_DIR="$SIGNING_DIR/certificates"
          PROFILES_DIR="$SIGNING_DIR/profiles"

          rm -rf "$SIGNING_DIR"
          mkdir -p "$CERTIFICATES_DIR" "$PROFILES_DIR"

          keychain initialize

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --certificates-dir "$CERTIFICATES_DIR" \
            --profiles-dir "$PROFILES_DIR" \
            --verbose

          CERTIFICATE=$(find "$CERTIFICATES_DIR" -type f -name '*.p12' -print -quit)
          PROFILE=$(find "$PROFILES_DIR" -type f \( -name '*.mobileprovision' -o -name '*.provisionprofile' \) -print -quit)

          if [ -z "$CERTIFICATE" ]; then
            echo "ERROR: Codemagic não descarregou/criou nenhum certificado .p12."
            exit 1
          fi

          if [ -z "$PROFILE" ]; then
            echo "ERROR: Codemagic não descarregou/criou nenhum provisioning profile App Store."
            exit 1
          fi

          keychain add-certificates --certificate "$CERTIFICATE"
          security find-identity -v -p codesigning

          security cms -D -i "$PROFILE" > "$SIGNING_DIR/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$SIGNING_DIR/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGNING_DIR/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$SIGNING_DIR/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$SIGNING_DIR/profile.plist")

          echo "Provisioning profile: $PROFILE_NAME"
          echo "Provisioning UUID: $PROFILE_UUID"
          echo "Team ID: $TEAM_ID"
          echo "Profile App ID: $PROFILE_APP_ID"

          if [ "$PROFILE_APP_ID" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "ERROR: O provisioning profile não corresponde a $BUNDLE_ID."
            exit 1
          fi

          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --profile "$PROFILE" \
            --archive-method app-store \
            --code-signing-setup-verbose-logging

          echo "Build settings de assinatura depois de aplicar o profile:"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -showBuildSettings | \
            grep -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE' || true

      - name: Bump build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed archive
        script: |
          set -euo pipefail

          SIGNING_DIR="$HOME/codemagic-signing"
          PROFILE_PLIST="$SIGNING_DIR/profile.plist"

          if [ ! -f "$PROFILE_PLIST" ]; then
            echo "ERROR: Não encontrei os dados do provisioning profile."
            exit 1
          fi

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-flags "-destination 'generic/platform=iOS'" \
            --archive-xcargs "CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE=$PROFILE_UUID PROVISIONING_PROFILE_SPECIFIER='$PROFILE_NAME'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - review.futsalsubstats@gmail.com
        notify:
          success: true
          failure: true

  # ------------------------------------------------------------------ Android
  android-preview:
    name: FutsalSubStats Android Preview
    max_build_duration: 45
    instance_type: linux_x2

    environment:
      node: lts
      java: 21
      vars:
        NEXT_TELEMETRY_DISABLED: "1"

    cache:
      cache_paths:
        - node_modules
        - ~/.gradle/caches

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Run checks and tests
        script: npm run check

      - name: Build web bundle and sync Android
        script: |
          npx next build
          npx cap sync android

      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk

  # ------------------------------------------------------- Google Play interno
  android-google-play:
    name: FutsalSubStats Android Google Play
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: lts
      java: 21
      android_signing:
        - futsalsubstats
      groups:
        - google-play
      vars:
        NEXT_TELEMETRY_DISABLED: "1"
        PACKAGE_NAME: "com.futsalsubstats.app"

    cache:
      cache_paths:
        - node_modules
        - ~/.gradle/caches

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Run checks and tests
        script: npm run check

      - name: Build web bundle and sync Android
        script: |
          npx next build
          npx cap sync android

      - name: Bump version code
        script: |
          ULTIMO=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --tracks internal || echo 0)
          cd android
          sed -i "s/versionCode .*/versionCode $(($ULTIMO + 1))/" app/build.gradle

      - name: Build signed AAB
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
      - android/app/build/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

      email:
        recipients:
          - review.futsalsubstats@gmail.com
        notify:
          success: true
          failure: true
