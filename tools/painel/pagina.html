<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Painel · Futsal SubStats</title>
<style>
  /* A paleta é a mesma do `globals.css`. Não é vaidade: quando o painel se
     parece com a app, um número estranho salta à vista por ser estranho, e não
     por estar num sítio que parece outro programa. */
  :root {
    --bg: #0b1220; --card: #16233b; --line: #2a3d5f; --text: #eaf1ff;
    --muted: #91a4c4; --primary: #22c55e; --primary-ink: #05240f;
    --warn: #f59e0b; --danger: #ef4444; --info: #38bdf8; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 10px; color: var(--muted); font-weight: 600; }
  .aviso { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .cartao { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .resumo { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  .resumo div { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .resumo dt { color: var(--muted); font-size: 12px; }
  .resumo dd { margin: 2px 0 0; font-size: 22px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  .etiqueta { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .etiqueta--clube { background: rgba(34,197,94,.15); color: var(--primary); }
  .etiqueta--treinador { background: rgba(56,189,248,.15); color: var(--info); }
  .etiqueta--activo { background: rgba(34,197,94,.15); color: var(--primary); }
  .etiqueta--expirado { background: rgba(239,68,68,.14); color: var(--danger); }
  .etiqueta--ver { background: rgba(145,164,196,.15); color: var(--muted); }
  .etiqueta--editar { background: rgba(245,158,11,.15); color: var(--warn); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .nowrap { white-space: nowrap; }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input, select, button {
    font: inherit; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #0f1a2e; color: var(--text);
  }
  input { min-width: 240px; }
  button { cursor: pointer; border-color: transparent; background: var(--primary); color: var(--primary-ink); font-weight: 700; }
  button.discreto { background: transparent; border-color: var(--line); color: var(--text); font-weight: 500; padding: 5px 10px; font-size: 13px; }
  button.perigo { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.35); color: #fecaca; }
  button:disabled { opacity: .5; cursor: progress; }
  .gestao td { background: rgba(15,26,46,.78); border-top: 1px solid var(--line); }
  .gestao__grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .gestao__bloco { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: rgba(11,18,32,.45); }
  .gestao__bloco h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .gestao__bloco form { align-items: flex-end; }
  .gestao__bloco label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
  .gestao__bloco label span { color: var(--muted); }
  .gestao__bloco input[type="checkbox"] { min-width: 0; width: 16px; height: 16px; }
  .associacoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
  .associacao { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 10px; }
  .associacao button { padding: 2px 7px; border-radius: 999px; background: rgba(239,68,68,.14); color: #fecaca; }
  #recado { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; display: none; }
  #recado.ok { display: block; background: rgba(34,197,94,.12); color: var(--primary); }
  #recado.erro { display: block; background: rgba(239,68,68,.12); color: var(--danger); }
</style>
</head>
<body>

<h1>Painel do Futsal SubStats</h1>
<p class="aviso">
  Só nesta máquina, e só enquanto o comando estiver a correr. Tudo o que se vê
  aqui são dados de clientes — cuidado com o que se mostra a quem esteja ao lado.
</p>

<dl class="resumo" id="resumo"></dl>

<h2>Criar conta</h2>
<div class="cartao">
  <form id="convite">
    <input id="email" type="email" placeholder="email@clube.pt" required autocomplete="off" />
    <select id="licenca">
      <option value="treinador">Licença de treinador</option>
      <option value="clube">Licença de clube</option>
    </select>
    <input id="validade" type="date" title="Validade da licença" />
    <select id="clube"><option value="">Sem clube</option></select>
    <button type="submit">Convidar</button>
  </form>
  <p class="muted small" style="margin: 10px 0 0" id="explicacao"></p>
  <p id="recado"></p>
</div>

<h2>Contas</h2>
<div class="cartao">
  <table id="tabela">
    <thead>
      <tr>
        <th>Email</th><th>Licença</th><th>Estado</th><th>Clube</th><th>Escalões</th>
        <th>Partilhados</th><th>Jogos</th><th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<h2>Clubes</h2>
<div class="cartao">
  <table id="clubes">
    <thead><tr><th>Clube</th><th>Dono</th><th>Escalões</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
// A chave da sessão vem na barra de endereço, na primeira visita. Guarda-se aqui
// e limpa-se do endereço, para não ficar no histórico nem em capturas de ecrã.
const CHAVE = new URL(location.href).searchParams.get('chave');
if (CHAVE) history.replaceState(null, '', location.pathname);

const $ = (s) => document.querySelector(s);
const texto = (s) => String(s ?? '').replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
let ESTADO = { contas: [], clubes: [], resumo: {} };
let CONTA_ABERTA = null;

async function pedir(caminho, opcoes = {}) {
  const r = await fetch(caminho, {
    ...opcoes,
    headers: { 'x-painel': CHAVE, ...(opcoes.body ? { 'content-type': 'application/json' } : {}) },
  });
  const dados = await r.json();
  if (!r.ok) throw new Error(dados.erro || 'Falhou.');
  return dados;
}

function recado(mensagem, tipo) {
  const el = $('#recado');
  el.textContent = mensagem;
  el.className = tipo;
}

// O `tipo` também passa pelo `texto`. Hoje só pode ser uma de quatro palavras
// que vêm do servidor, mas uma classe montada com texto de fora é o género de
// coisa que fica certa até alguém acrescentar um campo.
const ETIQUETA = (v, tipo) => `<span class="etiqueta etiqueta--${texto(tipo)}">${texto(v)}</span>`;

function fimDaEpoca() {
  const agora = new Date();
  const ano = agora.getUTCMonth() >= 6 ? agora.getUTCFullYear() + 1 : agora.getUTCFullYear();
  return `${ano}-06-30`;
}

function soData(iso) {
  return iso ? String(iso).slice(0, 10) : '';
}

function validadeTexto(iso) {
  return iso ? soData(iso) : 'sem data';
}

function opcoesClubes(seleccionado = '') {
  return '<option value="">Escolher clube</option>' +
    ESTADO.clubes.map((c) => (
      `<option value="${texto(c.id)}" ${c.id === seleccionado ? 'selected' : ''}>${texto(c.nome)}</option>`
    )).join('');
}

function painelGestao(c) {
  const associados = c.associadoA || [];
  return `
    <tr class="gestao" data-gestao="${texto(c.id)}">
      <td colspan="8">
        <div class="gestao__grid">
          <div class="gestao__bloco">
            <h3>Licença</h3>
            <form data-licenca-form="${texto(c.id)}">
              <label><span>Tipo</span>
                <select name="licenca">
                  <option value="treinador" ${c.licenca === 'treinador' ? 'selected' : ''}>Treinador</option>
                  <option value="clube" ${c.licenca === 'clube' ? 'selected' : ''}>Clube</option>
                </select>
              </label>
              <label><span>Validade</span>
                <input name="validade" type="date" value="${texto(soData(c.validade) || fimDaEpoca())}" />
              </label>
              <label style="display:flex;align-items:center;margin-bottom:10px">
                <input name="forcar" type="checkbox" />
                <span>forçar mesmo com escalões a mais</span>
              </label>
              <button type="submit">Guardar licença</button>
              <button type="button" class="perigo" data-remover-licenca="${texto(c.id)}">Remover licença</button>
            </form>
          </div>

          <div class="gestao__bloco">
            <h3>Clubes associados</h3>
            <form data-clube-form="${texto(c.id)}">
              <select name="clubeId">${opcoesClubes()}</select>
              <button type="submit">Associar clube</button>
            </form>
            <div class="associacoes">
              ${associados.length
                ? associados.map((a) => `
                    <span class="associacao">
                      ${texto(a.nome)}
                      <button type="button" title="Remover associação" data-desassociar="${texto(c.id)}" data-clube="${texto(a.id)}">×</button>
                    </span>
                  `).join('')
                : '<span class="muted small">Ainda não está associado a clubes de terceiros.</span>'}
            </div>
          </div>
        </div>
      </td>
    </tr>
  `;
}

function desenhar(estado) {
  ESTADO = estado;
  const r = estado.resumo;
  $('#resumo').innerHTML = [
    ['Contas', r.contas],
    ['Licença de clube', r.comLicencaClube],
    ['Licença de treinador', r.comLicencaTreinador],
    ['Activas', r.licencasActivas],
    ['Expiradas', r.licencasExpiradas],
    ['Ainda sem clube', r.semClube],
    ['Clubes', r.clubes],
    ['Escalões', r.escaloes],
    ['Jogos registados', r.jogos],
  ].map(([nome, valor]) => `<div><dt>${nome}</dt><dd>${valor}</dd></div>`).join('');

  $('#tabela tbody').innerHTML = estado.contas.map((c) => `
    <tr>
      <td>${texto(c.email)}</td>
      <td>${ETIQUETA(c.licenca, c.licenca)}</td>
      <td>
        ${ETIQUETA(c.activo ? 'activa' : 'expirada', c.activo ? 'activo' : 'expirado')}
        <div class="small muted nowrap">${texto(validadeTexto(c.validade))}</div>
      </td>
      <td>${c.clube
          ? texto(c.clube.nome)
          : c.associadoA.length
            ? `<span class="muted small">associado a ${texto(c.associadoA.map((x) => x.nome).join(', '))}</span>`
            : '<span class="muted small">—</span>'}</td>
      <td class="small">${c.escaloes.length ? texto(c.escaloes.join(', ')) : '<span class="muted">—</span>'}</td>
      <td class="small">${c.partilhados.length
          ? c.partilhados.map((p) => `${texto(p.nome)} ${ETIQUETA(p.nivel, p.nivel)}`).join('<br>')
          : '<span class="muted">—</span>'}</td>
      <td>${c.jogos}</td>
      <td>
        <button class="discreto" data-gerir="${texto(c.id)}">gerir</button>
      </td>
    </tr>
    ${CONTA_ABERTA === c.id ? painelGestao(c) : ''}`).join('');

  $('#clubes tbody').innerHTML = estado.clubes.map((c) => `
    <tr><td>${texto(c.nome)}</td><td class="small muted">${texto(c.dono)}</td><td>${c.escaloes}</td></tr>
  `).join('') || '<tr><td colspan="3" class="muted">Ainda não há clubes.</td></tr>';

  // A lista de clubes do formulário só muda quando os clubes mudam, mas
  // reescrevê-la é mais barato do que descobrir se mudou.
  const escolhido = $('#clube').value;
  $('#clube').innerHTML = '<option value="">Sem clube</option>' +
    estado.clubes.map((c) => `<option value="${texto(c.id)}">${texto(c.nome)}</option>`).join('');
  $('#clube').value = escolhido;
  ajustarFormulario();
}

async function carregar() {
  try {
    desenhar(await pedir('/api/estado'));
  } catch (e) {
    recado(e.message, 'erro');
  }
}

function ajustarFormulario() {
  $('#explicacao').textContent =
    'A conta nasce sem palavra-passe: sai o email de convite e é a pessoa que escolhe a dela. Pode ficar sem clube ou já associada a um clube existente.';
}

$('#licenca').addEventListener('change', ajustarFormulario);
$('#validade').value = fimDaEpoca();
ajustarFormulario();

$('#convite').addEventListener('submit', async (e) => {
  e.preventDefault();
  const botao = e.target.querySelector('button');
  botao.disabled = true;
  try {
    const r = await pedir('/api/convidar', {
      method: 'POST',
      body: JSON.stringify({
        email: $('#email').value,
        licenca: $('#licenca').value,
        validade: $('#validade').value || fimDaEpoca(),
        clubeId: $('#clube').value || null,
      }),
    });
    recado(r.mensagem, 'ok');
    $('#email').value = '';
    await carregar();
  } catch (err) {
    recado(err.message, 'erro');
  } finally {
    botao.disabled = false;
  }
});

$('#tabela').addEventListener('click', async (e) => {
  const gerir = e.target.closest('[data-gerir]');
  if (gerir) {
    CONTA_ABERTA = CONTA_ABERTA === gerir.dataset.gerir ? null : gerir.dataset.gerir;
    desenhar(ESTADO);
    return;
  }

  const remover = e.target.closest('[data-remover-licenca]');
  if (remover) {
    const conta = ESTADO.contas.find((c) => c.id === remover.dataset.removerLicenca);
    if (!conta || !confirm(`Remover a licença de ${conta.email}? A conta fica como treinador expirado.`)) return;
    remover.disabled = true;
    try {
      const r = await pedir('/api/remover-licenca', {
        method: 'POST',
        body: JSON.stringify({ userId: conta.id }),
      });
      recado(r.mensagem, 'ok');
      await carregar();
    } catch (err) {
      recado(err.message, 'erro');
    } finally {
      remover.disabled = false;
    }
    return;
  }

  const desassociar = e.target.closest('[data-desassociar]');
  if (desassociar) {
    const conta = ESTADO.contas.find((c) => c.id === desassociar.dataset.desassociar);
    const clube = ESTADO.clubes.find((c) => c.id === desassociar.dataset.clube);
    if (!conta || !clube || !confirm(`Remover ${conta.email} do clube ${clube.nome}? Também remove acessos aos escalões desse clube.`)) return;
    desassociar.disabled = true;
    try {
      const r = await pedir('/api/desassociar-clube', {
        method: 'POST',
        body: JSON.stringify({ userId: conta.id, clubeId: clube.id }),
      });
      recado(r.mensagem, 'ok');
      await carregar();
    } catch (err) {
      recado(err.message, 'erro');
    } finally {
      desassociar.disabled = false;
    }
  }
});

$('#tabela').addEventListener('submit', async (e) => {
  const formLicenca = e.target.closest('[data-licenca-form]');
  const formClube = e.target.closest('[data-clube-form]');
  if (!formLicenca && !formClube) return;
  e.preventDefault();

  const botao = e.target.querySelector('button[type="submit"]');
  if (!botao) return;
  botao.disabled = true;

  try {
    let r;
    if (formLicenca) {
      const userId = formLicenca.dataset.licencaForm;
      const dados = new FormData(formLicenca);
      r = await pedir('/api/licenca', {
        method: 'POST',
        body: JSON.stringify({
          userId,
          licenca: dados.get('licenca'),
          validade: dados.get('validade') || fimDaEpoca(),
          forcar: dados.get('forcar') === 'on',
        }),
      });
    } else {
      const userId = formClube.dataset.clubeForm;
      const dados = new FormData(formClube);
      const clubeId = dados.get('clubeId');
      if (!clubeId) throw new Error('Escolhe um clube para associar.');
      r = await pedir('/api/associar-clube', {
        method: 'POST',
        body: JSON.stringify({ userId, clubeId }),
      });
    }
    recado(r.mensagem, 'ok');
    await carregar();
  } catch (err) {
    recado(err.message, 'erro');
  } finally {
    botao.disabled = false;
  }
});

carregar();
</script>
</body>
</html>
